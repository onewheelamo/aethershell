general {
    # Permet à Jellyfin/Navigateurs de bloquer la mise en veille pendant la lecture
    ignore_dbus_inhibit = false 
}

# 1. ÉCONOMISEUR D'ÉCRAN OLED (5 minutes = 300 secondes)
listener {
    timeout = 300
    on-timeout = hyprctl eval 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'
}

# 2. MISE EN VEILLE DU SYSTÈME (1 heure = 3600 secondes)
listener {
    timeout = 3600
    on-timeout = systemctl suspend          # Met le Lenovo Yoga en veille
}
