# ~/.config/hypr/hyprlock.conf
# Source : dev/hypr_modular/hyprlock.conf — déployé par dev/deploy.sh (mode --arch).
#
# Les couleurs ne sont pas écrites ici : hyprlock-colors.conf est régénéré depuis
# style_vars.json par core/generate_rofi_theme.sh, donc le verrou suit la même
# palette que la barre, les fenêtres et les popups. Un changement de thème dans
# le panneau se répercute sans toucher à ce fichier.
#
# Typographie : Inter partout, la même famille que l'interface du shell. Les
# glyphes des boutons viennent de 0xProto Nerd Font, comme la barre.

source = ~/.config/hypr/hyprlock-colors.conf

$font = Inter
$font_icon = 0xProto Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    text_trim = true
    fail_timeout = 2500
}

animations {
    enabled = true
}

# Fond : capture de l'écran au moment du verrouillage, floutée à 24 px. Rien à
# maintenir côté wallpaper, et l'écran de verrouillage reprend exactement ce que
# la session affichait. brightness et vibrancy sont baissés pour que l'heure
# reste lisible sur un fond clair.
background {
    monitor =
    path = screenshot
    color = $bg
    blur_passes = 3
    blur_size = 24
    noise = 0.015
    contrast = 1.0
    brightness = 0.72
    vibrancy = 0.12
    vibrancy_darkness = 0.0
}

# Heure — chiffres tabulaires, comme l'heure de la barre, pour que les minutes
# ne dansent pas d'une minute à l'autre.
label {
    monitor =
    text = <span font_features='tnum'>$TIME</span>
    color = $fg
    font_size = 100
    font_family = $font
    position = 0, 168
    halign = center
    valign = center
}

# Date en toutes lettres, en retrait.
label {
    monitor =
    text = cmd[update:60000] date +"%A %-d %B"
    color = $fg_soft
    font_size = 16
    font_family = $font
    position = 0, 86
    halign = center
    valign = center
}

# Champ de mot de passe : capsule de 48 px, cerclée d'un trait d'accent.
input-field {
    monitor =
    size = 320, 50
    outline_thickness = 1
    rounding = 24
    dots_size = 0.18
    dots_spacing = 0.15
    dots_center = true
    inner_color = $surface_glass
    outer_color = $outline
    font_color = $accent
    font_family = $font
    placeholder_text = Mot de passe
    fail_text = <i>Mot de passe refusé</i> ($ATTEMPTS)
    check_color = $accent
    fail_color = $error
    capslock_color = $warn
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}

# Une seule ligne de lecture : artiste et titre, jamais les paroles. Sans
# lecteur actif, playerctl n'écrit rien et la ligne disparaît.
label {
    monitor =
    text = cmd[update:2000] ~/.config/quickshell/core/lock_media.sh
    color = $fg_dim
    font_size = 14
    font_family = $font
    position = 0, -92
    halign = center
    valign = center
}

# Veille / redémarrage / extinction, en glyphes MDI, comme la barre.
label {
    monitor =
    text = 󰒲
    color = $fg_soft
    font_size = 22
    font_family = $font_icon
    onclick = systemctl suspend
    position = -52, -205
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰜉
    color = $fg_soft
    font_size = 22
    font_family = $font_icon
    onclick = systemctl reboot
    position = 0, -205
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰐥
    color = $fg_soft
    font_size = 22
    font_family = $font_icon
    onclick = systemctl poweroff
    position = 52, -205
    halign = center
    valign = center
}
