[package]
name = "as-core"
version = "0.1.0"
edition = "2021"
description = "Backend unifié haute performance pour AetherShell"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
walkdir = "2.5"
glob = "0.3"
regex = "1.10"
ureq = { version = "2.10", features = ["json"] }
rusqlite = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
