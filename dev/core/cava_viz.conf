# cava pour le visualiseur du shell — mode « barres ».
#
# Fichier propre au shell, passé par `cava -p` : la configuration personnelle de
# l'utilisateur (~/.config/cava/config) n'est ni lue ni modifiée. C'est ce qui
# garantit que le rendu ne change pas parce qu'un autre outil a été réglé.
#
# Sortie : une ligne par trame, valeurs 0..100 séparées par « ; », lues telles
# quelles par VisualiseurAudio.qml (data_format = ascii).

[general]
framerate = 30
bars = 24

[input]
# Le monitor du sink par défaut : ce que l'on entend, pas le micro.
method = pulse
source = @DEFAULT_MONITOR@

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59

[smoothing]
# Lissage proche des réglages d'origine de cava : des barres qui montent vite et
# redescendent lentement, sinon elles clignotent au lieu de danser.
monstercat = 1
waves = 0
noise_reduction = 0.77
