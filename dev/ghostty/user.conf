# Réglages personnels de Ghostty — chargé en dernier, jamais écrasé par Ryoku.
#
# Flou derrière la fenêtre : Ghostty ne le demande pas par défaut. Sous Wayland il
# passe par ext-background-effect-v1, que Hyprland 0.57 implémente
# (ext_background_effect_manager_v1). Sans cette ligne, la fenêtre n'a que
# l'opacité du compositeur : le fond reste net à travers elle (kitty, lui, obtient
# le flou par `background_blur`).
#
# Attention : Ghostty est mono-instance — une fenêtre ouverte par le processus
# déjà en cours réutilise la configuration lue à *son* démarrage. Après avoir
# modifié ce fichier, faire `ctrl+shift+,` (reload_config) dans le terminal, ou
# relancer Ghostty.
background-blur = true
